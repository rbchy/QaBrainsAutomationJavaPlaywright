name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Cucumber + Playwright (headless Chromium)
    # Playwright 1.53 does not support ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B --no-transfer-progress test-compile
      - name: Install Chromium for Playwright
        run: mvn -B --no-transfer-progress exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Run @smoke and @regression scenarios
        run: mvn -B --no-transfer-progress test -Dheadless=true
      - name: Upload Cucumber report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            target/cucumber-reports/
            target/screenshots/
            target/surefire-reports/
          if-no-files-found: ignore
